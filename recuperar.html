<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Rally Traver</title>
  <link rel="stylesheet" href="style/stylesheet.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="recuperar-body">
  <header>
    <nav>
      <ul>
        <li><a href="paginaprincipal.html">Inicio</a></li>
        <li><a href="#">Acerca de Nosotros</a></li>
        <li><a href="#">Centro de Ayuda</a></li>
      </ul>
      <img src="Images/logo.png" alt="Logo Rally Traver" class="logo-nav">
    </nav>
  </header>

  <main class="recuperar-container">
    <h1>¿Has Olvidado la Contraseña?</h1>
    <h2>Ingresa el correo de tu cuenta y te enviaremos un enlace seguro.</h2>

    <form id="recuperar-form" novalidate>
      <label for="email">CORREO ELECTRÓNICO</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <button type="submit">Enviar enlace</button>
    </form>

    <p id="mensaje-confirmacion" class="recovery-status" aria-live="polite"></p>

     <ul>
        <li><a href="index.html">Iniciar Sesión</a></li>
      </ul>
    <img src="Images/avion1.png" alt="Avión decorativo" class="avion avion-izquierda">
    <img src="Images/avion2.png" alt="Avión decorativo" class="avion avion-derecha">
  </main>

  <script src="script-recuperar.js"></script>
</body>
</html>
